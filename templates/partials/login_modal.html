<div class="login-backdrop" id="loginBackdrop" hidden>
  <div class="login-box" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <div class="login-hd">
      <svg width="32" height="32" viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="9" fill="#161a23"/><path d="M7 14.5C7 12.015 9.015 10 11.5 10H18C20.485 10 22.5 12.015 22.5 14.5S20.485 19 18 19h-3l-3 3v-3h-.5C9.015 19 7 16.985 7 14.5Z" stroke="#7c83ff" stroke-width="1.5" stroke-linejoin="round"/><path d="M22.5 15.5H24.5C26.985 15.5 29 17.515 29 20s-2.015 4.5-4.5 4.5H24l-3 3v-3c-1.38 0-2.598-.637-3.402-1.628" stroke="#b07cff" stroke-width="1.5" stroke-linejoin="round"/><circle cx="27" cy="10" r="3" fill="#f87171"/></svg>
      <div>
        <h2 id="loginTitle">欢迎使用楷米阅读</h2>
        <p>登录后开始 · 任何语言 → 中文语音</p>
      </div>
      <button class="login-close" aria-label="关闭" onclick="closeLogin()">×</button>
    </div>
    <div class="login-body" id="loginChoices">
      <p class="sec-lbl">选择登录方式</p>
      <div class="oauth-list">
        <button class="oauth-btn" onclick="openVisitorLogin()">
          <div class="oauth-ico" style="background:linear-gradient(135deg,#7c83ff,#b07cff);color:#fff">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <span>访客登录 — 仅需用户名</span>
        </button>
        <button class="oauth-btn" onclick="openPhoneLogin()">
          <div class="oauth-ico" style="background:rgba(124,131,255,.15);color:var(--accent)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"/><line x1="12" y1="18" x2="12" y2="18"/></svg>
          </div>
          <span>使用手机号登录</span>
        </button>
        <button class="oauth-btn" onclick="loginWith('google')">
          <div class="oauth-ico" style="background:#fff"><svg width="14" height="14" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg></div>
          <span>使用 Google 账号登录</span>
        </button>
        <button class="oauth-btn" onclick="loginWith('github')">
          <div class="oauth-ico" style="background:#24292e"><svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.014-1.703-2.782.604-3.369-1.34-3.369-1.34-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg></div>
          <span>使用 GitHub 账号登录</span>
        </button>
      </div>
    </div>

    <div class="login-body" id="visitorPane" hidden>
      <p class="sec-lbl">输入用户名以创建账户</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        <input id="visitorNameInput" type="text" maxlength="32"
               placeholder="例如:小明 / alice123"
               style="background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;outline:none"/>
        <div id="visitorErr" style="color:#f87171;font-size:12px;padding:6px 8px;line-height:1.55;white-space:pre-line;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);border-radius:6px" hidden></div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="oauth-btn" style="flex:1;justify-content:center" onclick="closeVisitorLogin()">返回</button>
          <button class="oauth-btn" id="visitorConfirmBtn"
                  style="flex:1;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent"
                  onclick="submitVisitorLogin()">进入</button>
        </div>
        <p style="color:var(--muted);font-size:11px;margin:6px 0 0;line-height:1.5">
          访客模式下,所有数据都保存在本机的 <code>user_data/&lt;用户名&gt;/</code> 文件夹下。
        </p>
      </div>
    </div>
  </div>
</div>
