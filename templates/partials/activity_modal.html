<!--
  Usage-activity heatmap ("contribution graph" style), built entirely from
  the user's real session history (`/api/sessions`) — no synthetic data.
  Opened from the user menu via `openActivity()`.
-->
<div class="activity-backdrop" id="activityBackdrop" hidden onclick="if(event.target===this) closeActivity()">
  <div class="activity-box" role="dialog" aria-modal="true" aria-labelledby="activityTitle">

    <div class="activity-hd">
      <h2 id="activityTitle">使用记录</h2>
      <button class="activity-close" aria-label="关闭" onclick="closeActivity()">×</button>
    </div>

    <div class="activity-body">
      <div class="activity-stats">
        <div class="activity-stat"><b id="actTotalDays">0</b><span>累计活跃天数</span></div>
        <div class="activity-stat"><b id="actCurStreak">0</b><span>当前连续天数</span></div>
        <div class="activity-stat"><b id="actMaxStreak">0</b><span>最长连续天数</span></div>
        <div class="activity-stat"><b id="actMonths">0</b><span>活跃月份数</span></div>
      </div>

      <div class="activity-grid-wrap">
        <div class="activity-grid" id="activityGrid"></div>
      </div>
      <div class="activity-legend">
        <span>少</span>
        <div class="activity-cell" data-level="0"></div>
        <div class="activity-cell" data-level="1"></div>
        <div class="activity-cell" data-level="2"></div>
        <div class="activity-cell" data-level="3"></div>
        <div class="activity-cell" data-level="4"></div>
        <span>多</span>
      </div>
      <div class="activity-empty" id="activityEmpty" hidden>暂无使用记录</div>
    </div>

  </div>
</div>
